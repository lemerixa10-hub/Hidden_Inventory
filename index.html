:root{--b1:#0000FF;--b2:#0202CF;--b3:#0000A3;--b4:#01017D;--b5:#010152;--b6:#00002B;--b7:#2424F2;--b8:#5252F2;--ink:#e6e6ff}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--ink);font:500 16px Rajdhani,system-ui,sans-serif;background:radial-gradient(circle at 15% -10%,var(--b4),var(--b6) 55%) fixed}
h1,h2,h3{font-family:'Shippori Mincho',Georgia,serif;margin:0 0 .5rem}
header{padding:1.4rem 1.5rem .6rem;display:flex;flex-wrap:wrap;align-items:end;gap:1rem;justify-content:space-between}
h1{font-size:2.3rem;letter-spacing:.02em;text-shadow:0 0 24px var(--b1)}
header small{color:var(--b8);font-size:1rem}
nav{display:flex;gap:.4rem;flex-wrap:wrap;padding:0 1.5rem;border-bottom:1px solid var(--b4)}
nav button{background:none;border:0;color:var(--ink);padding:.7rem 1rem;font:700 1rem Rajdhani;cursor:pointer;border-bottom:3px solid transparent;opacity:.7}
nav button span{display:block;font-size:.72rem;color:var(--b8);font-weight:500}
nav button.on{opacity:1;border-color:var(--b1);background:linear-gradient(var(--b5)0,transparent)}
main{padding:1.2rem 1.5rem 3rem;max-width:1200px;margin:auto}
section{display:none}section.on{display:block}
.grid3,.grid2{display:grid;gap:1rem;margin-bottom:1rem}
.grid3{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.grid2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:linear-gradient(160deg,var(--b5),var(--b6));border:1px solid var(--b3);border-radius:6px;padding:1rem}
.card h3{font-size:1.2rem}
button.btn,.card button,dialog button{background:var(--b2);color:#fff;border:1px solid var(--b8);border-radius:4px;padding:.45rem .9rem;font:700 .95rem Rajdhani;cursor:pointer}
button.btn:hover,dialog button:hover{background:var(--b1)}
.bar{height:9px;background:var(--b6);border-radius:9px;overflow:hidden;margin:.5rem 0;border:1px solid var(--b4)}
.bar i{display:block;height:100%;background:var(--c,var(--b8));box-shadow:0 0 10px var(--c,var(--b8))}
.chip{border:1px solid;border-radius:20px;padding:0 .6rem;font-size:.82rem;margin-right:.4rem}
.row{display:flex;align-items:center;gap:.6rem;padding:.4rem 0;border-bottom:1px solid var(--b4)}
.row .g{flex:1}.row small{color:#9a9af0}.x{color:#9a9af0;cursor:pointer;background:none;border:0}
.week{display:flex;align-items:end;gap:.5rem;height:110px;margin:.5rem 0}
.week div{flex:1;text-align:center;font-size:.8rem}
.week i{display:block;background:var(--b8);border-radius:3px 3px 0 0;min-height:2px;box-shadow:0 0 8px var(--b1)}
.year{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.8rem}
.mo h4{margin:.2rem 0;color:var(--b8)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:.75rem}
.days b{font-weight:500;text-align:center;padding:3px 0;border-radius:3px;cursor:pointer;position:relative;background:var(--b6)}
.days b:hover{background:var(--b3)}.days b.t{outline:2px solid var(--b1);background:var(--b3)}
.days b.h{cursor:default;background:none;color:var(--b8)}
.days b u{position:absolute;bottom:0;left:15%;right:15%;height:3px;border-radius:2px}
.cal-head{display:flex;gap:.6rem;align-items:center;margin-bottom:.6rem}
.timer{font:800 5rem 'Shippori Mincho',serif;text-align:center;text-shadow:0 0 30px var(--b1);margin:.3rem 0}
.center{text-align:center}.center>*{margin:.25rem}
select,input{background:var(--b6);color:#fff;border:1px solid var(--b3);border-radius:4px;padding:.4rem;font:inherit}
.wk{display:grid;grid-template-columns:repeat(7,minmax(120px,1fr));gap:.5rem;overflow-x:auto}
.wk>div{background:var(--b6);border:1px solid var(--b4);border-radius:5px;padding:.5rem;min-height:140px}
.wk>div.t{border-color:var(--b1);box-shadow:0 0 12px var(--b2)}
.blk{border-left:4px solid;padding:.2rem .4rem;margin:.3rem 0;font-size:.85rem;background:var(--b5);cursor:pointer}
table{width:100%;border-collapse:collapse}td{padding:.35rem;border-bottom:1px solid var(--b4)}
#focus{position:fixed;inset:0;background:#000;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
background:radial-gradient(circle,var(--b5),#000 70%)}
#focus.on{display:flex}#focus .timer{font-size:min(22vw,11rem)}
#toasts{position:fixed;right:1rem;bottom:1rem;display:grid;gap:.5rem;z-index:60;max-width:320px}
#toasts div{background:var(--b4);border:1px solid var(--b1);border-left:5px solid var(--b8);padding:.6rem .8rem;border-radius:4px;cursor:pointer;box-shadow:0 0 18px var(--b2)}
dialog{background:var(--b5);color:var(--ink);border:1px solid var(--b1);border-radius:6px;min-width:290px}
dialog::backdrop{background:#000a}dialog label{display:block;margin:.5rem 0}dialog input,dialog select{width:100%;display:block}
dialog form div{display:flex;gap:.5rem;margin-top:.8rem}
:focus-visible{outline:2px solid var(--b8);outline-offset:2px}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s}}
details{margin:.3rem 0}summary{cursor:pointer;font-weight:700;padding:.3rem 0}.card h4{margin:.8rem 0 .2rem;color:#9a9af0}.row label{font-size:.8rem;color:#9a9af0}
.ban{width:100%;height:130px;object-fit:cover;border-radius:4px;margin-bottom:.6rem;border:1px solid var(--c)}.ban.sm{height:70px}
.hero{position:relative;height:210px;border-radius:6px;overflow:hidden;margin-bottom:1rem;border:1px solid var(--b3)}.hero img{width:100%;height:100%;object-fit:cover;filter:brightness(.85)}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,var(--b6))}.hero div{position:absolute;left:1.2rem;bottom:.8rem;z-index:1;text-shadow:0 0 12px #000}.hero h2{font-size:1.9rem;margin:0}
.meter{display:flex;gap:3px;margin:.5rem 0 .2rem}.meter i{flex:1;height:8px;border-radius:2px;background:var(--b6);border:1px solid var(--c)}.meter i.on{background:var(--c);box-shadow:0 0 8px var(--c)}
.dm-Physics{background:radial-gradient(1px 1px at 20% 30%,#fff,transparent),radial-gradient(1.5px 1.5px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 80%,#aaf,transparent),radial-gradient(1px 1px at 85% 65%,#fff,transparent),radial-gradient(1px 1px at 10% 70%,#fff,transparent),radial-gradient(circle at 50% 0,#01017D,#00002B 70%)!important}
.dm-Biology{background:radial-gradient(circle at 15% 95%,#4C4D6A,transparent 45%),radial-gradient(circle at 90% 8%,#212034,transparent 40%),#11101C!important}
.dm-Chemistry{background:radial-gradient(circle at 50% 115%,#A30808,transparent 55%),radial-gradient(circle at 92% 5%,#730303,transparent 40%),#0F0000!important}
#bellw{position:relative;display:inline-block}#badge{background:#FF0000;border-radius:10px;padding:0 .4rem;margin-left:.3rem;font-style:normal;font-size:.75rem}#badge:empty{display:none}
#np{display:none;position:absolute;right:0;top:115%;width:min(370px,90vw);max-height:70vh;overflow:auto;background:var(--b5);border:1px solid var(--b1);border-radius:6px;padding:.6rem;z-index:40;box-shadow:0 0 24px var(--b2)}#np.open{display:block}.nt{padding:.45rem 0;border-bottom:1px solid var(--b4)}.nt small{color:#9a9af0}
</style></head><body>
<header><div><h1>呪術 Hidden Inventory</h1><small id="q"></small></div><div><button class="btn" data-a="focusOn">Focus mode</button> <span id="bellw"><button class="btn" data-a="bell" aria-label="Notifications">🔔<i id="badge"></i></button><div id="np"></div></span></div></header>
<nav id="nav"></nav>
<main>
<section id="dash"></section>
<section id="pomo">
 <div class="grid2"><div class="card center"><h3>Cursed energy timer</h3>
 <div><button class="btn" data-a="m:focus">Focus 25</button><button class="btn" data-a="m:short">Short 5</button><button class="btn" data-a="m:long">Long 15</button></div>
 <div id="mode">Focus</div><div class="timer" id="tm">25:00</div>
 <label>Subject <select id="psub"><option>Chemistry<option>Biology<option>Physics</select></label>
 <div><button class="btn" id="go" data-a="toggle">Start</button><button class="btn" data-a="reset">Reset</button></div></div>
 <div class="card" id="plog"></div></div>
</section>
<section id="syl"></section><section id="sched"></section><section id="exam"></section><section id="task"></section>
</main>
<div id="focus"><h3 id="fmode"></h3><div class="timer" id="ftm"></div><div id="fsub"></div>
<p id="fch"></p>
<div><button class="btn" id="fgo" data-a="toggle">Start</button> <button class="btn" data-a="focusOff">Exit focus mode</button></div></div>
<div id="toasts"></div><dialog id="dlg"></dialog>
<script>
const $=s=>document.querySelector(s),K='jjkPlanner';
let S={events:[],sched:[],exams:[],grades:[],tasks:[],log:[],goal:600,syl:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem(K)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}render()};
const id=()=>Math.random().toString(36).slice(2);
const SUB={Chemistry:'#FF0000',Biology:'#9897AF',Physics:'#5252F2',General:'#2424F2'};
const DK={Chemistry:'#730303',Biology:'#212034',Physics:'#01017D',General:'#010152'};
const S3=['Chemistry','Biology','Physics'],DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const TABS=[['dash','Dashboard','Domain'],['syl','Syllabus','Curriculum'],['pomo','Pomodoro','Cursed energy'],['sched','Study schedule','Training'],['exam','Exams & grades','Rankings'],['task','Assignments','Missions']];
const QUOTES=['Nothing beats a focused mind.','One more session, then rest.','Sharpen the technique daily.','Revise like the exam is tomorrow.'];
const ymd=d=>d.toLocaleDateString('en-CA'),today=()=>ymd(new Date());
const wk=()=>{const d=new Date();d.setDate(d.getDate()-(d.getDay()+6)%7);return[...Array(7)].map((_,i)=>{const x=new Date(d);x.setDate(d.getDate()+i);return ymd(x)})};
const dl=d=>Math.round((new Date(d+'T00:00')-new Date(today()+'T00:00'))/864e5);
const mins=(s,ds)=>S.log.filter(l=>(!s||l.sub==s)&&ds.includes(l.date)).reduce((a,l)=>a+l.min,0);
const avg=s=>{const g=S.grades.filter(g=>g.sub==s);return g.length?Math.round(g.reduce((a,g)=>a+g.score/g.max*100,0)/g.length):null};
const chip=s=>`<span class=chip style="background:${DK[s]};border-color:${SUB[s]}">${s}</span>`;
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const items=()=>[...S.events.map(e=>({d:e.date,t:e.title,s:e.sub,k:'Event'})),...S.tasks.filter(t=>!t.done).map(t=>({d:t.date,t:t.title,s:t.sub,k:'Due'})),...S.exams.map(x=>({d:x.date,t:x.title,s:x.sub,k:'Exam'}))];
const del=(a,i)=>`<button class=x data-del="${a}:${i}" title="Delete">✕</button>`;

function ask(title,fields,cb){const d=$('#dlg');
d.innerHTML=`<form method=dialog><h3>${title}</h3>${fields.map(f=>`<label>${f.l}${f.o?`<select name=${f.k}>${f.o.map(o=>`<option>${o}`).join('')}</select>`:`<input name=${f.k} type=${f.t||'text'} ${f.t=='number'?'step=any':''} value="${f.v||''}" required>`}</label>`).join('')}<div><button value=ok>Save</button><button value=x formnovalidate>Cancel</button></div></form>`;
d.showModal();d.querySelector('form').onsubmit=e=>{if(e.submitter.value=='ok')cb(Object.fromEntries(new FormData(e.target)))}}
let NOTES=[],UNREAD=0;
function toast(m){NOTES.unshift({m,t:new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})});NOTES=NOTES.slice(0,40);UNREAD++;paintNP()}
function paintNP(){const n=$('#np');if(n.classList.contains('open'))UNREAD=0;$('#badge').textContent=UNREAD||'';
n.innerHTML=`<div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.4rem"><button class=btn data-a=cheer>Cheer me on</button><button class=btn data-a=notif>Enable browser alerts</button><button class=btn data-a=clr>Clear</button></div>`+(NOTES.length?NOTES.map(x=>`<div class=nt>${x.m}<br><small>${x.t}</small></div>`).join(''):'<small>No notifications yet.</small>')}
function notify(t,b){try{if(Notification.permission=='granted')new Notification(t,{body:b})}catch(e){}}

/* ---------- views ---------- */
let Y=new Date().getFullYear();
function cal(){const it=items();let h=`<div class=cal-head><button class=btn data-a=py>◀</button><h3 style="margin:0">${Y}</h3><button class=btn data-a=ny>▶</button><small>Click any day to add an event.</small></div><div class=year>`;
for(let m=0;m<12;m++){const off=(new Date(Y,m,1).getDay()+6)%7,n=new Date(Y,m+1,0).getDate();
h+=`<div class=mo><h4>${new Date(Y,m).toLocaleString('en',{month:'long'})}</h4><div class=days>${DAYS.map(d=>`<b class=h>${d[0]}</b>`).join('')}${'<span></span>'.repeat(off)}`;
for(let d=1;d<=n;d++){const k=`${Y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`,f=it.filter(i=>i.d==k);
h+=`<b data-d="${k}" class="${k==today()?'t':''}" title="${esc(f.map(i=>i.k+': '+i.t).join('\n'))}">${d}${f.length?`<u style="background:${SUB[f[0].s]||SUB.General}"></u>`:''}</b>`}
h+='</div></div>'}return h+'</div>'}
function dash(){const w=wk(),tot=mins(0,w),mx=Math.max(60,...w.map(d=>mins(0,[d])));
const up=items().filter(i=>dl(i.d)>=0&&dl(i.d)<=7).sort((a,b)=>a.d>b.d?1:-1);
return `<div class=grid3>${S3.map(s=>{const t=S.tasks.filter(t=>t.sub==s),dn=t.filter(t=>t.done).length,a=avg(s);
return `<div class="card dm-${s}" style="border-color:${SUB[s]};--c:${SUB[s]}">${ban(s,'sm')}${dhead(s)}<div class=bar><i style="width:${t.length?dn/t.length*100:0}%"></i></div><div>${dn}/${t.length} assignments done<br>${mins(s,w)} min studied this week<br>Average grade: ${a==null?'–':a+'%'}<br>Syllabus: ${sylStat(s)[1]}/${sylStat(s)[0]} sessions studied</div></div>`}).join('')}</div>
<div class=grid2><div class=card><h3>Weekly progress</h3><div class=bar><i style="width:${Math.min(100,tot/S.goal*100)}%"></i></div>
<div>${tot} / ${S.goal} min goal <button class=x data-a=goal>edit goal</button></div>
<div class=week>${w.map((d,i)=>`<div><i style="height:${mins(0,[d])/mx*80}px"></i>${DAYS[i]}</div>`).join('')}</div></div>
<div class=card><h3>Next 7 days</h3>${up.length?up.map(i=>`<div class=row>${chip(i.s)}<span class=g>${esc(i.t)}<br><small>${i.k} · ${i.d} (${dl(i.d)?dl(i.d)+' days':'today'})</small></span></div>`).join(''):'Nothing due. Add an event or assignment.'}</div></div>
<div class=card><h3>Year calendar</h3>${cal()}${S.events.length?`<h3 style="margin-top:1rem">My events</h3>`+S.events.slice().sort((a,b)=>a.date>b.date?1:-1).map(e=>`<div class=row>${chip(e.sub)}<span class=g>${esc(e.title)} <small>${e.date}</small></span>${del('events',e.id)}</div>`).join(''):''}</div>`}
function sched(){const t=wk(),today_=(new Date().getDay()+6)%7;
return `<div class=card><h3>Weekly study schedule <button class=btn data-a=addSched>+ Add block</button></h3><div class=wk>${DAYS.map((d,i)=>`<div class="${i==today_?'t':''}"><b>${d}</b>${S.sched.filter(b=>b.day==d).sort((a,b)=>a.start>b.start?1:-1).map(b=>`<div class=blk data-del="sched:${b.id}" style="border-color:${SUB[b.sub]}" title="Click to delete">${b.start}–${b.end}<br>${esc(b.title)}</div>`).join('')}</div>`).join('')}</div></div>`}
function exam(){return `<div class=grid2><div class=card><h3>Exam timetable <button class=btn data-a=addExam>+ Exam</button></h3>${S.exams.length?S.exams.slice().sort((a,b)=>a.date>b.date?1:-1).map(x=>`<div class=row>${chip(x.sub)}<span class=g>${esc(x.title)}<br><small>${x.date} · ${dl(x.date)<0?'done':dl(x.date)+' days left'}</small></span>${del('exams',x.id)}</div>`).join(''):'No exams yet.'}</div>
<div class=card><h3>Grades <button class=btn data-a=addGrade>+ Grade</button></h3>${S3.map(s=>{const a=avg(s);return `<div style="margin-bottom:.8rem;--c:${SUB[s]}"><b style="color:${SUB[s]}">${s}</b> ${a==null?'':a+'% avg'}<div class=bar><i style="width:${a||0}%"></i></div>${S.grades.filter(g=>g.sub==s).map(g=>`<div class=row><span class=g>${esc(g.title)}</span>${g.score}/${g.max} (${Math.round(g.score/g.max*100)}%)${del('grades',g.id)}</div>`).join('')}</div>`}).join('')}</div></div>`}
function task(){return `<p><button class=btn data-a=addTask>+ New assignment</button></p><div class=grid3>${S3.map(s=>{const t=S.tasks.filter(t=>t.sub==s).sort((a,b)=>a.date>b.date?1:-1),dn=t.filter(x=>x.done).length;
return `<div class=card style="border-color:${SUB[s]};--c:${SUB[s]}"><h3 style="color:${SUB[s]}">${s} tracker</h3><div class=bar><i style="width:${t.length?dn/t.length*100:0}%"></i></div>${t.map(x=>`<div class=row><input type=checkbox data-chk="${x.id}" ${x.done?'checked':''}><span class=g style="${x.done?'text-decoration:line-through;opacity:.6':''}">${esc(x.title)}<br><small>${!x.done&&dl(x.date)<0?'overdue · ':''}due ${x.date}</small></span>${del('tasks',x.id)}</div>`).join('')||'<small>No assignments.</small>'}</div>`}).join('')}</div>`}
function plog(){const t=today(),l=S.log.filter(x=>x.date==t);$('#plog').innerHTML=`<h3>Today</h3><p>${l.length} sessions · ${l.reduce((a,x)=>a+x.min,0)} min</p>${S3.map(s=>`<div class=row>${chip(s)}<span class=g>${mins(s,[t])} min today</span>${mins(s,wk())} min this week</div>`).join('')}`}
function render(){$('#dash').innerHTML=dash();$('#syl').innerHTML=syl();$('#sched').innerHTML=sched();$('#exam').innerHTML=exam();$('#task').innerHTML=task();plog()}

const OPEN=new Set(['Chemistry0.0','Physics0.0','Biology0.0']),lv=k=>S.syl[k]||0;
document.addEventListener('toggle',e=>{const k=e.target.dataset&&e.target.dataset.k;if(k)e.target.open?OPEN.add(k):OPEN.delete(k)},true);
function sylStat(s){let n=0,a=0,b=0;SYL[s].forEach((c,ci)=>c[1].forEach((u,ui)=>u[1].forEach((_,si)=>{const l=lv(s+ci+'.'+ui+'.'+si);n++;a+=l>0;b+=l>1})));return[n,a,b]}
const DOM={Chemistry:['Authentic Mutual Love','Yuta'],Biology:['Chimera Shadow Garden','Megumi'],Physics:['Unlimited Void','Gojo']};
const STG=[[0,'Hand signs'],[20,'Incomplete domain'],[45,'Barrierless domain'],[70,'Complete domain'],[95,'Mastered']];
const mast=s=>{const[n,a,b]=sylStat(s);return Math.round((a+b)/(2*n)*100)};
function dhead(s){const m=mast(s),i=STG.reduce((x,g,j)=>m>=g[0]?j:x,0);
return `<h3 style="color:${SUB[s]}">${DOM[s][0]}</h3><small>${s} · ${DOM[s][1]}'s domain</small><div class=meter>${STG.map((g,j)=>`<i class="${j<=i?'on':''}" title="${g[1]}"></i>`).join('')}</div><small>Mastery ${m}% · <b>${STG[i][1]}</b></small><br>`}
function syl(){return `<p><small>Tick S when you've studied a session and R when you've revised it. Both build your domain mastery.</small></p><div class=grid3 style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr))">`+S3.map(s=>{const[n,a,b]=sylStat(s);
return `<div class="card dm-${s}" style="border-color:${SUB[s]};--c:${SUB[s]}">${ban(s)}${dhead(s)}<small>${a}/${n} studied · ${b}/${n} revised</small>`+SYL[s].map((c,ci)=>`<h4>${c[0]}</h4>`+c[1].map((u,ui)=>{const k=s+ci+'.'+ui,d=u[1].filter((_,si)=>lv(k+'.'+si)>0).length;
return `<details data-k="${k}" ${OPEN.has(k)?'open':''}><summary>${u[0]} <small>${d}/${u[1].length}</small></summary>`+u[1].map((t,si)=>{const q=k+'.'+si,l=lv(q);
return `<div class=row><span class=g style="${l>1?'opacity:.6':''}">S${si+1} – ${t}</span><label title="Studied"><input type=checkbox data-sy="${q}" data-lv=1 ${l>0?'checked':''}> S</label><label title="Revised"><input type=checkbox data-sy="${q}" data-lv=2 ${l>1?'checked':''}> R</label></div>`}).join('')+`</details>`}).join('')).join('')+`</div>`}).join('')+`</div>`}
/* ---------- pomodoro + focus mode ---------- */
const D={focus:25,short:5,long:15},MN={focus:'Focus',short:'Short break',long:'Long break'};let P={m:'focus',left:1500,iv:null,end:0};
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function paint(){const t=fmt(P.left);$('#tm').textContent=$('#ftm').textContent=t;document.title=P.iv?t+' · Hidden Inventory':'Hidden Inventory';
$('#go').textContent=$('#fgo').textContent=P.iv?'Pause':'Start';$('#mode').textContent=$('#fmode').textContent=MN[P.m];$('#fsub').textContent=$('#psub').value}
function stop(){clearInterval(P.iv);P.iv=null}
function setM(m){stop();P.m=m;P.left=D[m]*60;paint()}
function toggle(){if(P.iv){stop()}else{P.end=Date.now()+P.left*1e3;P.iv=setInterval(()=>{P.left=Math.max(0,Math.round((P.end-Date.now())/1e3));if(!P.left)done();paint()},500)}paint()}
function done(){const f=P.m=='focus';if(f){S.log.push({date:today(),sub:$('#psub').value,min:D.focus});save()}
setM(f?'short':'focus');const m=f?'Session complete. Take a break.':'Break over. Back to it.';say(f?'win':'cheer',m);notify('Pomodoro',m)}
/* ---------- actions ---------- */
const ACT={
cheer:()=>{const w=rnd(NAMES);toast(voice(w,rnd(CH[w].cheer)))},bell:()=>{$('#np').classList.toggle('open');paintNP()},clr:()=>{NOTES=[];paintNP()},py:()=>{Y--;render()},ny:()=>{Y++;render()},
toggle,reset:()=>setM(P.m),
focusOn:()=>{paint();{const w=rnd(NAMES);$('#fch').innerHTML=voice(w,rnd(CH[w].cheer))}$('#focus').classList.add('on');try{document.documentElement.requestFullscreen()}catch(e){}if(!P.iv)toggle()},
focusOff:()=>{$('#focus').classList.remove('on');try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}},
notif:()=>{try{Notification.requestPermission().then(p=>toast(p=='granted'?'Reminders enabled.':'Notifications blocked; in-app reminders still work.'))}catch(e){toast('Notifications unsupported here.')}},
goal:()=>ask('Weekly goal',[{k:'g',l:'Minutes per week',t:'number',v:S.goal}],v=>{S.goal=+v.g||600;save()}),
addSched:()=>ask('Study block',[{k:'day',l:'Day',o:DAYS},{k:'start',l:'Start',t:'time'},{k:'end',l:'End',t:'time'},{k:'title',l:'What'},{k:'sub',l:'Subject',o:S3}],v=>{S.sched.push({id:id(),...v});save()}),
addExam:()=>ask('Exam',[{k:'title',l:'Exam name'},{k:'sub',l:'Subject',o:S3},{k:'date',l:'Date',t:'date'}],v=>{S.exams.push({id:id(),...v});save()}),
addGrade:()=>ask('Grade',[{k:'title',l:'Test / assignment'},{k:'sub',l:'Subject',o:S3},{k:'score',l:'Score',t:'number'},{k:'max',l:'Out of',t:'number',v:100}],v=>{S.grades.push({id:id(),...v,score:+v.score,max:+v.max||100});save()}),
addTask:()=>ask('Assignment',[{k:'title',l:'Title'},{k:'sub',l:'Subject',o:S3},{k:'date',l:'Due',t:'date'}],v=>{S.tasks.push({id:id(),...v,done:false});save()})};
const addEv=d=>ask('Event on '+d,[{k:'title',l:'Title'},{k:'sub',l:'Subject',o:[...S3,'General']}],v=>{S.events.push({id:id(),date:d,...v});save()});
document.addEventListener('click',e=>{if(!e.target.closest('#bellw'))$('#np').classList.remove('open');const t=e.target.closest('[data-d],[data-del],[data-chk],[data-sy],[data-a]');if(!t)return;const q=t.dataset;
if(q.d)addEv(q.d);
else if(q.del){const[a,i]=q.del.split(':');if(confirm('Delete this item?')){S[a]=S[a].filter(x=>x.id!=i);save()}}
else if(q.sy){const c=lv(q.sy);S.syl[q.sy]=q.lv==1?(c>0?0:1):(c>1?1:2);save()}
else if(q.chk){const x=S.tasks.find(x=>x.id==q.chk);x.done=!x.done;save()}
else if(q.a.startsWith('m:'))setM(q.a.slice(2));
else ACT[q.a]()});
$('#psub').onchange=paint;
$('#nav').innerHTML=TABS.map((t,i)=>`<button data-tab="${t[0]}" class="${i?'':'on'}">${t[1]}<span>${t[2]}</span></button>`).join('');
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(!b)return;document.querySelectorAll('nav button,main section').forEach(x=>x.classList.remove('on'));b.classList.add('on');$('#'+b.dataset.tab).classList.add('on')};
$('#dash').classList.add('on');
/* ---------- smart reminders ---------- */
const seen=new Set();
function remind(){const m=[];
S.tasks.filter(t=>!t.done).forEach(t=>{const d=dl(t.date);if(d<0)m.push([t.id,`Overdue: ${t.title} (${t.sub})`,rnd(['Sukuna','Toji','Higuruma'])]);else if(d<=1)m.push([t.id,`${t.title} is due ${d?'tomorrow':'today'}`,'Nanami'])});
S.exams.forEach(x=>{const d=dl(x.date);if(d>=0&&d<=3)m.push([x.id,`${x.title} is in ${d} day(s). Revise ${x.sub}.`,rnd(['Nanami','Higuruma'])])});
S.events.forEach(e=>{if(e.date==today())m.push([e.id,`Today: ${e.title}`,'Yuta'])});
if(new Date().getHours()>=17&&!mins(0,[today()]))m.push(['n'+today(),'No study logged today. Start one pomodoro?','Gojo']);
m.forEach(([i,t,w])=>{if(!seen.has(i)){seen.add(i);say('nag',esc(t),w);notify(w+' says',t)}})}
$('#q').textContent=QUOTES[new Date().getDate()%QUOTES.length];
render();paint();paintNP();remind();setTimeout(()=>say('cheer'),1500);setInterval(remind,60000);
</script></body></html>
